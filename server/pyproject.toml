[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pylinkage-editor-server"
version = "0.1.0"
description = "Python backend for pylinkage-editor: simulation, synthesis and export over HTTP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pylinkage[numba,scipy,svg]>=1.2.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
# DXF and STEP export. build123d is heavy; the routes answer 501 without it.
cad = ["pylinkage[cad]"]

[project.scripts]
pylinkage-editor-server = "pylinkage_editor_server.main:run"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pylinkage_editor_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
